<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#7ec8e3">
<title>Row Bird</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --ink: #1d2b36;
    --card: #fffdf6;
    --accent: #ff8c42;
    --accent-dark: #d96a1f;
    --green: #3fa34d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #7ec8e3; color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; }

  /* In-game heads-up display */
  .hud { position: fixed; left: 0; right: 0; pointer-events: none; display: flex;
         justify-content: space-between; align-items: center; padding: 12px 16px; }
  #hudTop { top: env(safe-area-inset-top, 0); align-items: flex-start; }
  #hudBottom { bottom: env(safe-area-inset-bottom, 0); justify-content: space-around; color: #fff; }
  #score { font-size: 44px; font-weight: 800; color: #fff; line-height: 1;
           -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
  #lives { font-size: 26px; letter-spacing: 2px; }
  .hud-mid { display: flex; align-items: center; gap: 12px; }
  #timer { font-size: 30px; font-weight: 800; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.25);
           -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill;
           font-variant-numeric: tabular-nums; }
  #timer.ending { color: #ffe14d; }
  #effects { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { background: rgba(255,255,255,.8); border-radius: 12px; padding: 2px 8px; font-size: 15px;
          font-weight: 700; box-shadow: inset 0 0 0 2px var(--green); }
  .chip.bad { background: rgba(255,228,222,.9); box-shadow: inset 0 0 0 2px #d9483b; }
  .stat { text-align: center; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  /* Big enough to read at a glance from the seat, a metre from the phone */
  #hudBottom { padding-bottom: 4px; }
  .stat b { display: block; font-size: clamp(30px, 11vh, 52px); line-height: 1.05; font-variant-numeric: tabular-nums;
            -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; }
  .stat span { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; opacity: .95; }
  #spm.onbeat { color: #7dffa0; }
  #pauseBtn { pointer-events: auto; font-size: 20px; width: 44px; height: 44px; border-radius: 50%;
              border: 0; background: rgba(255,255,255,.7); color: var(--ink); }

  .mini-row { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
  .mini-row button { font: inherit; font-size: 14px; font-weight: 600; padding: 6px 14px; border-radius: 18px;
                     border: 2px solid #c4bea9; background: transparent; color: var(--ink); }

  /* Power-up announcement */
  #banner { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 68px); z-index: 2;
            transform: translateX(-50%); pointer-events: none; text-align: center; white-space: nowrap;
            max-width: calc(100vw - 32px); padding: 8px 26px; border-radius: 18px;
            background: rgba(232,250,235,.95); color: #1f6b2b; box-shadow: inset 0 0 0 3px var(--green), 0 6px 18px rgba(0,0,0,.2); }
  #banner.bad { background: rgba(255,236,232,.95); color: #a3291f; box-shadow: inset 0 0 0 3px #d9483b, 0 6px 18px rgba(0,0,0,.2); }
  #bannerTitle { font-size: clamp(26px, 9vh, 44px); font-weight: 900; line-height: 1.15; }
  #bannerDesc { font-size: clamp(15px, 4.5vh, 20px); font-weight: 600; white-space: normal; }
  #bannerDesc:empty { display: none; }
  #banner.show { animation: banner 2.8s ease-out forwards; }
  @keyframes banner {
    0%   { transform: translateX(-50%) scale(.5); opacity: 0; }
    8%   { transform: translateX(-50%) scale(1.08); opacity: 1; }
    14%  { transform: translateX(-50%) scale(1); }
    85%  { opacity: 1; }
    100% { transform: translateX(-50%) scale(1); opacity: 0; }
  }

  /* 3, 2, 1, GOOO! */
  #countdown { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
               pointer-events: none; font-size: min(40vh, 40vw); font-weight: 900; color: #fff;
               -webkit-text-stroke: 4px var(--ink); text-shadow: 0 8px 0 rgba(0,0,0,.25); }
  #countdown.go { color: var(--accent); font-size: min(26vh, 22vw); }
  #countdown.pop { animation: pop .9s ease-out forwards; }
  @keyframes pop {
    0%   { transform: scale(.3); opacity: 0; }
    20%  { transform: scale(1.1); opacity: 1; }
    35%  { transform: scale(1); }
    80%  { opacity: 1; }
    100% { transform: scale(1.15); opacity: 0; }
  }

  /* Menu / game-over overlays */
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
             padding: 16px; background: rgba(20,40,60,.25); }
  .card { background: var(--card); border-radius: 20px; padding: 24px 20px; width: 100%; max-width: 380px;
          max-height: 100%; overflow-y: auto;
          box-shadow: 0 10px 30px rgba(0,0,0,.25); text-align: center; }
  h1 { margin: 0 0 4px; font-size: 40px; letter-spacing: -.02em; }
  h2 { margin: 0 0 8px; font-size: 32px; }
  .sub { margin: 0 0 18px; opacity: .7; }
  button.big { display: block; width: 100%; font: inherit; font-size: 20px; font-weight: 700;
               padding: 16px; margin: 10px 0; border: 0; border-radius: 14px;
               background: var(--accent); color: #fff; box-shadow: 0 4px 0 var(--accent-dark); }
  button.big:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-dark); }
  button.big.secondary { background: #e6e1d3; color: var(--ink); box-shadow: 0 4px 0 #c4bea9; }
  button.big.go { background: var(--green); box-shadow: 0 4px 0 #2c7a37; }
  button.big:disabled { opacity: .45; }
  /* Connected: reads as a status badge rather than something to press */
  button.big.connected, button.big.connected:disabled { opacity: 1; background: #e3f4e5; color: #2c7a37;
                                                        box-shadow: inset 0 0 0 2px var(--green); transform: none; }
  button.big.connected small { display: block; font-size: 13px; font-weight: 500; opacity: .8; }
  label.setting { display: flex; align-items: center; justify-content: space-between; gap: 10px;
                  margin: 14px 0 6px; font-size: 15px; text-align: left; }
  label.setting input { width: 90px; font: inherit; font-size: 18px; padding: 8px; text-align: center;
                        border-radius: 10px; border: 2px solid #c4bea9; background: #fff; color: var(--ink); }

  /* Endless / Timed */
  .seg-row { display: flex; gap: 8px; margin: 14px 0 0; }
  .seg { flex: 1; font: inherit; font-size: 16px; font-weight: 600; padding: 10px 6px; border-radius: 12px;
         border: 2px solid #c4bea9; background: transparent; color: var(--ink); }
  .seg.on { border-color: var(--accent); background: #ffe6d3; }
  .seg-row.small { margin-top: 8px; }
  .seg-row.small .seg { font-size: 14px; padding: 6px 4px; }
  .duration { margin: 10px 0 0; text-align: left; }
  .duration-head { display: flex; justify-content: space-between; font-size: 15px; }
  .duration input { width: 100%; height: 28px; margin: 4px 0 0; accent-color: var(--accent); }
  .ticks { display: flex; justify-content: space-between; padding: 0 4px; font-size: 12px; opacity: .7; }

  /* On/off switch */
  label.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px;
                 margin: 12px 0 0; font-size: 15px; text-align: left; }
  label.toggle small { display: block; opacity: .7; }
  label.toggle input { appearance: none; -webkit-appearance: none; flex: none; margin: 0; position: relative;
                       width: 52px; height: 30px; border-radius: 15px; background: #c4bea9; transition: background .2s; }
  label.toggle input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
                              border-radius: 50%; background: #fff; transition: transform .2s; }
  label.toggle input:checked { background: var(--green); }
  label.toggle input:checked::after { transform: translateX(22px); }

  .hint { font-size: 13px; opacity: .7; margin: 6px 0 0; }
  .hint.best { margin-top: 12px; }
  #status { min-height: 1.3em; margin: 10px 0 0; font-weight: 600; }
  #status:empty { display: none; }
  .hidden { display: none !important; }

  /* Sideways phone: settings on the left, connect/start on the right, so nothing needs scrolling */
  @media (orientation: landscape) and (max-height: 520px) {
    .menu-card { max-width: 760px; display: grid; grid-template-columns: 1fr 1.25fr; gap: 24px;
                 align-items: center; padding: 14px 20px; }
    .menu-card h1 { font-size: 30px; }
    .menu-card .sub { display: none; }
    .menu-card .seg-row { margin-top: 8px; }
    .menu-card .seg { padding: 7px 6px; }
    .menu-card .seg-row.small { margin-top: 6px; }
    .menu-card .seg-row.small .seg { padding: 4px; }
    .menu-card label.toggle { margin-top: 8px; }
    .menu-card .hint.best { margin-top: 8px; }
    .source-buttons { display: flex; gap: 10px; }
    .source-buttons button.big { margin: 0; }
    .menu-controls button.big { font-size: 17px; padding: 12px; }
    .menu-controls label.setting { margin-top: 10px; }
    .menu-controls #status { margin-top: 6px; }
    .menu-controls #startBtn { margin-bottom: 0; }
    .menu-card .mini-row { margin-top: 10px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hudTop" class="hud hidden">
  <div>
    <div id="score">0</div>
    <div id="effects"></div>
  </div>
  <div class="hud-mid">
    <span id="timer" class="hidden"></span>
    <button id="pauseBtn" aria-label="Pause">❚❚</button>
  </div>
  <div id="lives"></div>
</div>
<div id="hudBottom" class="hud hidden">
  <div class="stat"><b id="spm">–</b><span>spm</span></div>
  <div class="stat"><b id="pace">–</b><span>/500m</span></div>
  <div class="stat"><b id="watts">–</b><span>watts</span></div>
</div>
<div id="countdown" class="hidden"></div>
<div id="banner" class="hidden"><div id="bannerTitle"></div><div id="bannerDesc"></div></div>

<!-- Main menu -->
<div id="menu" class="overlay">
  <div class="card menu-card">
    <div class="menu-intro">
      <h1>Row Bird</h1>
      <p class="sub">Every stroke is a flap. Pull harder to fly higher.</p>

      <div class="seg-row">
        <button class="seg" data-mode="endless">Endless</button>
        <button class="seg" data-mode="timed">Timed</button>
      </div>
      <div id="durationBox" class="duration">
        <div class="duration-head"><span>Run length</span><b id="durationLabel"></b></div>
        <input id="durationInput" type="range" min="0" max="3" step="1">
        <div class="ticks"><span>5</span><span>10</span><span>15</span><span>20</span></div>
      </div>
      <div class="seg-row small">
        <button class="seg" data-diff="easy">Easy</button>
        <button class="seg" data-diff="normal">Normal</button>
        <button class="seg" data-diff="hard">Hard</button>
      </div>
      <label class="toggle">
        <span>Power-ups<small>Random bonuses and hazards along the river</small></span>
        <input id="powerupsInput" type="checkbox">
      </label>
      <p class="hint best"><span id="bestLabel"></span>: <b id="bestMenu">0</b></p>
    </div>
    <div class="menu-controls">
      <div class="source-buttons">
        <button id="connectBtn" class="big">Connect PM5</button>
        <button id="simBtn" class="big secondary">Try without rower</button>
      </div>

      <label class="setting">Target power (watts)
        <input id="targetInput" type="number" inputmode="numeric" min="30" max="600" step="5">
      </label>
      <p class="hint">A stroke at your target keeps the bird level. Harder strokes fly higher, lighter ones sink.</p>

      <p id="status"></p>
      <button id="startBtn" class="big go hidden">Start</button>
      <p class="hint" id="rotateHint">Tip: turn your phone sideways to see obstacles coming sooner.</p>
      <div class="mini-row">
        <button id="soundBtn"></button>
        <button id="fsBtn" class="hidden">⛶ Full screen</button>
      </div>
    </div>
  </div>
</div>

<!-- Pause -->
<div id="pauseMenu" class="overlay hidden">
  <div class="card">
    <h2>Paused</h2>
    <p id="pauseMsg" class="sub"></p>
    <button id="reconnectBtn" class="big hidden">Reconnect PM5</button>
    <button id="resumeBtn" class="big go">Resume</button>
    <button id="quitBtn" class="big secondary">Quit to menu</button>
  </div>
</div>

<!-- Game over / time's up -->
<div id="overMenu" class="overlay hidden">
  <div class="card">
    <h2 id="overTitle">Splash!</h2>
    <p class="sub">Score <b id="finalScore">0</b> · Best <b id="bestOver">0</b></p>
    <p id="overStats" class="hint"></p>
    <button id="againBtn" class="big go">Row again</button>
    <button id="menuBtn" class="big secondary">Menu</button>
  </div>
</div>

<script>
'use strict';

/* ------------------------------------------------------------------
 * Tunables. Units: the screen is 1.0 tall; y grows downward.
 * ------------------------------------------------------------------ */
const GROUND = 0.88;        // water line; touching it costs a life
const BIRD_R = 0.035;
const GATE_W = 0.13;
const SCROLL = 0.12;        // world scroll speed, screen-heights per second
const SPACING = 0.95;       // distance between gates (~8s apart)
const START_LIVES = 3;
const MAX_LIVES = 5;
const DURATIONS = [5, 10, 15, 20];  // timed run lengths, minutes

// Gentle gravity so one target-power stroke every ~2.5s keeps you level.
const GRAVITY = 0.1;
const MAX_FALL = 0.2;
// Each stroke is a small hop when the drive starts, then the main lift when
// it ends and we know how hard it was.
const HOP_V = 0.04;
const FLAP_V = 0.085;       // lift from a stroke at exactly target power
const MIN_LIFT = 0.05, MAX_LIFT = 1.8;  // lift scales with watts, within these limits
// Easing off should be as usable as pulling harder. Below DOWN_KNEE × target, lift falls
// DOWN_GAIN times faster, so a 0.8× stroke sinks about as much as a 1.6× stroke climbs.
// The knee leaves normal stroke-to-stroke variation (±5%) behaving linearly.
const DOWN_KNEE = 0.95, DOWN_GAIN = 2;
const DRIVE_TIMEOUT = 2;    // lift anyway if the power reading never arrives
const RHYTHM_SPM = 24;      // the rate FLAP_V is balanced for; the rhythm ring counts one stroke at this rate

// Difficulty. Endless starts at `gap` and narrows toward `minGap` as you score; Timed keeps
// `timedGap` the whole run so a long workout doesn't turn hard just as you tire.
// `wander` is how far one gap can move up or down from the last.
const DIFFICULTY = {
  easy:   { gap: 0.47, minGap: 0.36, timedGap: 0.44, wander: 0.3 },
  normal: { gap: 0.42, minGap: 0.28, timedGap: 0.36, wander: 0.4 },
  hard:   { gap: 0.37, minGap: 0.25, timedGap: 0.30, wander: 0.48 },
};
const NEAR_MISS = 0.015;    // clearing a gate by less than this earns a "Close one!"
const DAY_MINUTES = 15;     // Endless loops a full day in this time; Timed goes morning to dusk

// Power-ups and power-downs, floating between gates.
const ITEM_R = 0.04;
const ITEM_CHANCE = 0.18;   // chance of an item between any two gates
const GOOD_CHANCE = 0.6;
const EFFECT_SECS = 12;     // how long Feather / Anchor last
const HEAVY = 1.25, LIGHT = 0.75;  // gravity multipliers
const GAP_GATES = 4;        // how many gates Wide gaps / Storm change
const ITEMS = {
  shield:  { icon: '🛡️', good: true,  label: 'Shield!',    desc: 'Blocks your next crash' },
  heart:   { icon: '❤️', good: true,  label: 'Extra life!', desc: '+1 heart' },
  star:    { icon: '⭐', good: true,  label: '+3 points!', desc: 'Bonus points' },
  feather: { icon: '🪶', good: true,  label: 'Feather!',   desc: `Lighter for ${EFFECT_SECS} seconds` },
  wide:    { icon: '↕️', good: true,  label: 'Wide gaps!', desc: `Next ${GAP_GATES} gates open up` },
  anchor:  { icon: '⚓', good: false, label: 'Anchor!',    desc: `Heavier for ${EFFECT_SECS} seconds: pull harder!` },
  storm:   { icon: '⛈️', good: false, label: 'Storm!',     desc: `Next ${GAP_GATES} gates get narrower` },
};

/* ------------------------------------------------------------------
 * Small helpers
 * ------------------------------------------------------------------ */
const $ = id => document.getElementById(id);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const nowSec = () => performance.now() / 1000;
const pick = list => list[Math.floor(Math.random() * list.length)];

// localStorage can be unavailable (private mode etc.); never let that break the game.
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem('rowbird.' + key); return v === null ? fallback : JSON.parse(v); }
    catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem('rowbird.' + key, JSON.stringify(value)); } catch {}
  },
};

function formatPace(sec) {
  if (!sec || sec > 599) return '–';
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}
function formatClock(sec) {
  sec = Math.max(0, Math.ceil(sec));
  return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
}
// Concept2's own formula: watts = 2.80 / (sec per meter)^3
const paceForWatts = w => w > 0 ? 500 / Math.cbrt(w / 2.8) : 0;

/* ------------------------------------------------------------------
 * Menu settings
 * ------------------------------------------------------------------ */
const settings = {
  mode: store.get('runMode', 'endless'),  // 'endless' | 'timed'
  durationIdx: clamp(store.get('durationIdx', 1), 0, DURATIONS.length - 1),
  powerups: store.get('powerups', true),
  difficulty: DIFFICULTY[store.get('difficulty')] ? store.get('difficulty') : 'normal',
  sound: store.get('sound', true),
};
const runMinutes = () => DURATIONS[settings.durationIdx];
// Normal keeps the original keys so earlier bests still count.
const bestKey = () => (settings.mode === 'endless' ? 'best' : `best.timed${runMinutes()}`) +
  (settings.difficulty === 'normal' ? '' : '.' + settings.difficulty);
const bestLabel = () => `Best (${settings.mode === 'endless' ? 'endless' : runMinutes() + ' min'}` +
  (settings.difficulty === 'normal' ? ')' : `, ${settings.difficulty})`);

/* ------------------------------------------------------------------
 * Rower data. Either a real PM5 over Bluetooth or the tap simulator
 * fills this in and calls driveStart() / driveEnd(watts) each stroke.
 * ------------------------------------------------------------------ */
const rower = {
  source: null,  // 'pm5' | 'sim' | null
  spm: 0,
  pace: 0,       // seconds per 500m
  watts: 0,      // power of the last finished stroke
};
let targetWatts = clamp(store.get('target', 120), 30, 600);

/* --- Concept2 PM5 Bluetooth -------------------------------------
 * Based on Concept2's published "PM5 Bluetooth Smart Interface
 * Definition". All values are little-endian.
 * ---------------------------------------------------------------- */
const pm5Uuid = n => `ce06${n}-43e5-11e4-916c-0800200c9a66`;
const PM5 = {
  rowingService: pm5Uuid('0030'),
  generalStatus: pm5Uuid('0031'),     // byte 10: stroke state (2 = driving)
  additionalStatus: pm5Uuid('0032'),  // stroke rate, pace
  sampleRate: pm5Uuid('0034'),        // write 3 => updates every 100ms
  strokeData2: pm5Uuid('0036'),       // per-stroke power and stroke count, sent as the drive ends
};
const u16 = (dv, o) => dv.getUint16(o, true);

let pm5Device = null;       // kept after a disconnect so we can reconnect without the chooser
let reconnecting = false;
let chooserNext = false;     // a direct reconnect failed; the next Connect tap opens the chooser
let lastStrokeState = -1;
let lastStrokeCount = -1;

const sleep = ms => new Promise(res => setTimeout(res, ms));
const withTimeout = (promise, ms) =>
  Promise.race([promise, sleep(ms).then(() => { throw new Error('timed out'); })]);

async function connectPM5() {
  if (pm5Device && !chooserNext) {
    if (await reconnectPM5()) return;
    chooserNext = true;
    setStatus("Couldn't reach the PM5. Press a button on it to wake it, then tap Connect to choose it again.");
    return;
  }
  setConnectButton('connecting');
  setStatus('Choose your PM5 in the pop-up…');
  try {
    pm5Device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'PM5' }],
      optionalServices: [PM5.rowingService],
    });
    pm5Device.ongattserverdisconnected = onPM5Disconnected;
    setStatus('Connecting…');
    await setupPM5();
    onPM5Connected();
  } catch (e) {
    console.error(e);
    setConnectButton('idle');
    if (e.name === 'NotFoundError') setStatus('No rower chosen. Wake the PM5 and try again.');
    else setStatus('Could not connect: ' + e.message);
  }
}

async function setupPM5() {
  const server = await withTimeout(pm5Device.gatt.connect(), 10000);
  const service = await server.getPrimaryService(PM5.rowingService);

  // Ask for faster updates so the drive is noticed quickly. Not fatal if refused.
  try {
    const rate = await service.getCharacteristic(PM5.sampleRate);
    await rate.writeValue(Uint8Array.of(3));
  } catch (e) { console.warn('Could not set sample rate', e); }

  // Subscribe one at a time; Android dislikes overlapping GATT requests.
  await subscribe(service, PM5.generalStatus, onGeneralStatus);
  await subscribe(service, PM5.additionalStatus, onAdditionalStatus);
  await subscribe(service, PM5.strokeData2, onStrokeData2);
  lastStrokeState = -1;
}

function onPM5Connected() {
  rower.source = 'pm5';
  chooserNext = false;
  setConnectButton('connected', pm5Device.name);
  setStatus('');
  showStart();
  if (game.state === 'paused') $('pauseMsg').textContent = "Reconnected. Tap Resume when you're ready.";
  refreshPauseMenu();
}

// Reconnect to the rower picked earlier this session, no chooser needed.
async function reconnectPM5() {
  if (reconnecting) return false;
  reconnecting = true;
  setConnectButton('connecting');
  refreshPauseMenu();
  try {
    await setupPM5();
    onPM5Connected();
    return true;
  } catch (e) {
    console.warn('Reconnect failed', e);
    try { pm5Device.gatt.disconnect(); } catch {}
    setConnectButton('idle');
    return false;
  } finally {
    reconnecting = false;
    refreshPauseMenu();
  }
}

async function subscribe(service, uuid, handler) {
  const ch = await service.getCharacteristic(uuid);
  ch.addEventListener('characteristicvaluechanged', ev => handler(ev.target.value));
  await ch.startNotifications();
}

function onGeneralStatus(dv) {
  const strokeState = dv.getUint8(10);
  if (strokeState === 2 && lastStrokeState !== 2) driveStart();
  lastStrokeState = strokeState;
}

function onAdditionalStatus(dv) {
  rower.spm = dv.getUint8(5);
  rower.pace = u16(dv, 7) / 100;
}

function onStrokeData2(dv) {
  const count = u16(dv, 7);
  if (count === lastStrokeCount) return;
  lastStrokeCount = count;
  driveEnd(u16(dv, 3));
}

// Dropped mid-session: pause and try to get it back a few times before asking for help.
async function onPM5Disconnected() {
  if (rower.source !== 'pm5' || reconnecting) return;  // a failed reconnect attempt also lands here
  rower.source = null;
  rower.spm = rower.watts = rower.pace = 0;
  hideStart();
  pause('Rower disconnected.');
  const say = text => { setStatus(text); if (game.state === 'paused') $('pauseMsg').textContent = text; };
  for (let attempt = 1; attempt <= 3; attempt++) {
    say(`Rower disconnected. Reconnecting (try ${attempt} of 3)…`);
    if (await reconnectPM5()) return;
    if (rower.source) return;  // switched to the simulator meanwhile
    await sleep(2000);
  }
  say("Couldn't reconnect. Press a button on the PM5 to wake it, then tap Reconnect.");
}

/* --- Simulator: press and hold the screen (or space) as the drive ---
 * Holding about half a second is a target-power stroke; longer is harder.
 * ---------------------------------------------------------------- */
const sim = { strokeTimes: [], driveStartedAt: null };

function simPress() {
  if (sim.driveStartedAt !== null) return;
  const now = nowSec();
  sim.driveStartedAt = now;
  sim.strokeTimes.push(now);
  if (sim.strokeTimes.length > 3) sim.strokeTimes.shift();
  if (sim.strokeTimes.length >= 2) {
    const interval = (now - sim.strokeTimes[0]) / (sim.strokeTimes.length - 1);
    rower.spm = Math.round(60 / interval);
  }
  driveStart();
}

function simRelease() {
  if (sim.driveStartedAt === null) return;
  const held = nowSec() - sim.driveStartedAt;
  sim.driveStartedAt = null;
  const watts = Math.round(targetWatts * clamp(held / 0.5, 0.25, 2.5));
  rower.pace = paceForWatts(watts);
  driveEnd(watts);
}

function updateSim() {
  if (nowSec() - (sim.strokeTimes.at(-1) ?? -99) > 6) rower.spm = 0;
}

/* ------------------------------------------------------------------
 * Game
 * ------------------------------------------------------------------ */
const game = {
  state: 'menu',  // 'menu' | 'countdown' | 'playing' | 'paused' | 'over'
  mode: 'endless',
  bird: { y: 0.45, vy: 0, flap: 0 },
  gates: [],
  items: [],
  popups: [],     // floating text: stroke watts, item names
  score: 0,
  lives: START_LIVES,
  invuln: 0,      // seconds of post-hit invincibility left
  timeLeft: 0,    // timed mode only
  countdown: 0,   // seconds left before play (re)starts
  driveTimer: 0,  // >0 while waiting for the current stroke's power
  lastLiftAt: -99,
  shield: false,
  heavy: 0,       // seconds of Anchor left
  light: 0,       // seconds of Feather left
  gapEffect: { delta: 0, gatesLeft: 0 },  // Wide gaps / Storm still to apply to new gates
  strokes: 0,
  wattsTotal: 0,
  crashes: 0,
  scrollX: 0,
  time: 0,
  runTime: 0,     // seconds actually played this run (drives the time of day)
  duration: 0,    // timed mode: run length in seconds
  diff: DIFFICULTY.normal,
  lastDriveAt: -99,  // game.time of the last drive start, for the rhythm ring
  particles: [],  // splash drops, feathers, leaves after a crash
  shake: 0,       // seconds of screen shake left
  flash: 0,       // red crash flash, fades from 1
};

function startGame() {
  Object.assign(game, {
    mode: settings.mode,
    diff: DIFFICULTY[settings.difficulty],
    bird: { y: 0.45, vy: 0, flap: 0 },
    gates: [], items: [], popups: [], particles: [],
    score: 0, lives: START_LIVES, invuln: 0,
    timeLeft: runMinutes() * 60, duration: runMinutes() * 60, runTime: 0,
    shield: false, heavy: 0, light: 0, gapEffect: { delta: 0, gatesLeft: 0 },
    strokes: 0, wattsTotal: 0, crashes: 0, shake: 0, flash: 0, lastDriveAt: -99,
  });
  addGate(worldW + 0.4);
  $('timer').classList.toggle('hidden', game.mode !== 'timed');
  $('lives').classList.toggle('hidden', game.mode !== 'endless');
  showOnly(null);
  setHud(true);
  updateHud(Infinity);
  keepScreenOn();
  startCountdown();
}

function startCountdown() {
  game.state = 'countdown';
  game.countdown = 3;
  game.bird.vy = 0;
  showCountdownNumber(3);
}

function showCountdownNumber(n) {
  const el = $('countdown');
  el.textContent = n > 0 ? n : 'GOOO!';
  el.classList.toggle('go', n === 0);
  el.classList.remove('hidden', 'pop');
  void el.offsetWidth;  // restart the CSS animation
  el.classList.add('pop');
  sound(n > 0 ? 'count' : 'go');
}

function addGate(x) {
  const prev = game.gates.at(-1), d = game.diff;
  let gapSize = game.mode === 'timed' ? d.timedGap : Math.max(d.minGap, d.gap - game.score * 0.005);
  if (game.gapEffect.gatesLeft > 0) {
    gapSize = clamp(gapSize + game.gapEffect.delta, 0.22, 0.5);
    game.gapEffect.gatesLeft--;
  }
  // Keep each gap within reach of the last one.
  const center = prev ? clamp(prev.center + (Math.random() - 0.5) * d.wander, 0.27, 0.66)
                      : 0.45;
  game.gates.push({ x, center, gapSize, targetGap: gapSize, passed: false, crashed: false,
                    margin: Infinity, seed: Math.random() });
  if (prev && settings.powerups && Math.random() < ITEM_CHANCE) addItem(prev, game.gates.at(-1));
}

// Halfway between two gates, at a height you can reach on the way from one gap to the next.
function addItem(a, b) {
  const y = clamp((a.center + b.center) / 2 + (Math.random() - 0.5) * 0.25, 0.15, 0.75);
  game.items.push({ x: (a.x + b.x) / 2, y, type: pickItemType(), taken: false });
}

function pickItemType() {
  if (Math.random() >= GOOD_CHANCE) return pick(['anchor', 'storm']);
  const bonus = game.mode === 'endless' && game.lives < MAX_LIVES ? 'heart' : 'star';
  return pick(['shield', bonus, 'feather', 'wide']);
}

function collect(item) {
  item.taken = true;
  // A heart placed before you reached max lives pays out as a star instead.
  if (item.type === 'heart' && game.lives >= MAX_LIVES) item.type = 'star';
  const kind = ITEMS[item.type];
  switch (item.type) {
    case 'shield': game.shield = true; break;
    case 'heart': game.lives = Math.min(MAX_LIVES, game.lives + 1); break;
    case 'star': game.score += 3; break;
    case 'feather': game.light = EFFECT_SECS; game.heavy = 0; break;
    case 'anchor': game.heavy = EFFECT_SECS; game.light = 0; break;
    case 'wide': changeGaps(+0.1); break;
    case 'storm': changeGaps(-0.07); break;
  }
  showBanner(`${kind.icon} ${kind.label}`, kind.desc, kind.good);
  sound(kind.good ? 'good' : 'bad');
  updateHud(Infinity);
}

// Big announcement across the top of the screen when you collect something.
let bannerTimer = null;
function showBanner(title, desc, good) {
  const el = $('banner');
  $('bannerTitle').textContent = title;
  $('bannerDesc').textContent = desc;
  el.classList.toggle('bad', !good);
  el.classList.remove('hidden', 'show');
  void el.offsetWidth;  // restart the CSS animation
  el.classList.add('show');
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => el.classList.add('hidden'), 2800);
}

// Widen or narrow the next few gates; ones already on screen visibly slide open/shut.
function changeGaps(delta) {
  let left = GAP_GATES;
  for (const p of game.gates) {
    if (left === 0) break;
    if (p.x - GATE_W / 2 < birdX + BIRD_R) continue;  // already at or behind the bird
    p.targetGap = clamp(p.targetGap + delta, 0.22, 0.5);
    left--;
  }
  game.gapEffect = { delta, gatesLeft: left };
}

// The drive has begun: a small hop right away so the bird feels connected to you.
function driveStart() {
  game.bird.flap = 0.5;
  if (game.state !== 'playing') return;
  game.lastDriveAt = game.time;
  game.bird.vy = Math.min(game.bird.vy, -HOP_V);
  game.driveTimer = DRIVE_TIMEOUT;
}

// The drive has finished and we know its power: the main lift.
function driveEnd(watts) {
  rower.watts = watts;
  game.bird.flap = 1;
  if (game.state !== 'playing') return;
  game.driveTimer = 0;
  // Ignore a second report for the same stroke (e.g. after the timeout fallback).
  if (game.time - game.lastLiftAt < 0.8) return;
  game.lastLiftAt = game.time;
  game.strokes++;
  game.wattsTotal += watts;

  const ratio = watts / targetWatts;
  const lift = ratio - DOWN_GAIN * Math.max(0, DOWN_KNEE - ratio);
  game.bird.vy = -FLAP_V * clamp(lift, MIN_LIFT, MAX_LIFT);
  addPopup(watts + 'W', birdX, game.bird.y - 0.06, powerColor(ratio));
  sound('stroke', ratio);
}

function powerColor(ratio) {
  if (ratio < 0.8) return '#ff8c42';   // light
  if (ratio < 1.2) return '#ffffff';   // on target
  if (ratio < 1.6) return '#7dffa0';   // strong
  return '#ffe14d';                    // huge
}

function addPopup(text, x, y, color, size = 0.05) {
  game.popups.push({ text, x, y, color, size, age: 0 });
}

function update(dt) {
  game.time += dt;
  if (rower.source === 'sim') updateSim();
  game.bird.flap = Math.max(0, game.bird.flap - dt * 3);
  for (const p of game.popups) { p.age += dt; p.y -= dt * 0.08; }
  game.popups = game.popups.filter(p => p.age < 1.4);
  for (const q of game.particles) {
    q.age += dt;
    q.vy += q.gravity * dt;
    q.vx *= 1 - q.drag * dt;
    q.vy *= 1 - q.drag * dt;
    q.x += q.vx * dt;
    q.y += q.vy * dt;
    q.angle += q.spin * dt;
  }
  game.particles = game.particles.filter(q => q.age < q.life);
  game.shake = Math.max(0, game.shake - dt);
  game.flash = Math.max(0, game.flash - dt * 2.5);

  if (game.state === 'menu') {
    game.scrollX += SCROLL * 0.5 * dt;
    game.bird.y = 0.45 + Math.sin(game.time * 2) * 0.02;
    return;
  }
  if (game.state === 'countdown') {
    game.scrollX += SCROLL * 0.5 * dt;
    const before = Math.ceil(game.countdown);
    game.countdown -= dt;
    const after = Math.ceil(game.countdown);
    if (after !== before) showCountdownNumber(Math.max(0, after));
    if (game.countdown <= 0) game.state = 'playing';
    return;
  }
  if (game.state !== 'playing') return;

  if (game.mode === 'timed') {
    const before = Math.ceil(game.timeLeft);
    game.timeLeft -= dt;
    const after = Math.ceil(game.timeLeft);
    if (after !== before && after <= 3 && after > 0) sound('count');
    if (game.timeLeft <= 0) { sound('finish'); return endRun(); }
  }
  game.runTime += dt;
  game.heavy = Math.max(0, game.heavy - dt);
  game.light = Math.max(0, game.light - dt);

  game.scrollX += SCROLL * dt;
  const b = game.bird;

  if (game.driveTimer > 0) {
    game.driveTimer -= dt;
    if (game.driveTimer <= 0) driveEnd(rower.watts || targetWatts);
  }
  const gravity = GRAVITY * (game.heavy > 0 ? HEAVY : game.light > 0 ? LIGHT : 1);
  b.vy = Math.min(b.vy + gravity * dt, MAX_FALL);
  b.y += b.vy * dt;
  if (b.y < BIRD_R) { b.y = BIRD_R; b.vy = Math.max(0, b.vy); }

  const r = BIRD_R * 0.8;  // same forgiving hitbox as findCollision
  for (const p of game.gates) {
    p.x -= SCROLL * dt;
    p.gapSize += (p.targetGap - p.gapSize) * Math.min(1, dt * 3);
    // Closest the bird came to either edge while inside the gate
    if (Math.abs(p.x - birdX) < GATE_W / 2 + r) {
      p.margin = Math.min(p.margin, b.y - r - (p.center - p.gapSize / 2), p.center + p.gapSize / 2 - b.y - r);
    }
    if (!p.passed && p.x + GATE_W / 2 < birdX - BIRD_R) {
      p.passed = true;
      if (p.crashed) continue;
      game.score++;
      // A negative margin means you went through it while invulnerable; no praise for that.
      if (p.margin >= 0 && p.margin < NEAR_MISS) {
        addPopup('Close one!', birdX + 0.05, b.y - 0.1, '#ffe14d', 0.055);
        sound('close');
      } else sound('gate');
    }
  }
  game.gates = game.gates.filter(p => p.x > -GATE_W);
  while (game.gates.at(-1).x < worldW + SPACING) addGate(game.gates.at(-1).x + SPACING);

  for (const it of game.items) {
    it.x -= SCROLL * dt;
    if (!it.taken && Math.hypot(it.x - birdX, it.y - b.y) < BIRD_R + ITEM_R) collect(it);
  }
  game.items = game.items.filter(it => !it.taken && it.x > -ITEM_R);

  if (game.invuln > 0) {
    game.invuln -= dt;
    if (b.y > GROUND - BIRD_R) { b.y = GROUND - BIRD_R; b.vy = Math.min(0, b.vy); }  // float
  } else {
    const hit = findCollision();
    if (hit) crash(hit);
  }
}

// Returns the gate hit, 'water', or null.
function findCollision() {
  const b = game.bird, r = BIRD_R * 0.8;  // slightly forgiving hitbox
  if (b.y + r > GROUND) return 'water';
  return game.gates.find(p =>
    Math.abs(p.x - birdX) < GATE_W / 2 + r &&
    (b.y - r < p.center - p.gapSize / 2 || b.y + r > p.center + p.gapSize / 2)) ?? null;
}

function crash(hit) {
  if (game.shield) {
    game.shield = false;
    game.invuln = 3;  // long enough to clear the gate (~1.55s to cross one)
    showBanner('🛡️ Shield saved you!', '', true);
    sound('shield');
    return;
  }
  if (hit !== 'water') hit.crashed = true;  // no point for a gate you crashed into
  game.crashes++;
  if (navigator.vibrate) navigator.vibrate(200);
  sound('crash', hit === 'water');
  crashBurst(hit);
  game.shake = 0.4;
  game.flash = 1;
  game.invuln = 3;
  if (game.bird.y > GROUND - 0.1) { game.bird.y = GROUND - BIRD_R; game.bird.vy = 0; }
  // Timed runs never end early; a crash just costs you that gate.
  if (game.mode === 'endless' && --game.lives <= 0) endRun();
}

// Something to see when you crash: a splash, or feathers plus leaves or stone chips.
function crashBurst(hit) {
  const b = game.bird;
  const rand = (lo, hi) => lo + Math.random() * (hi - lo);
  const add = (n, props) => {
    for (let i = 0; i < n; i++) {
      game.particles.push({
        x: birdX + rand(-0.02, 0.02), y: b.y + rand(-0.02, 0.02), age: 0, angle: rand(0, 6), spin: rand(-6, 6),
        ...Object.fromEntries(Object.entries(props).map(([k, v]) => [k, Array.isArray(v) ? rand(...v) : v])),
      });
    }
  };
  if (hit === 'water') {
    add(18, { shape: 'drop', color: '#cdeefa', vx: [-0.2, 0.2], vy: [-0.45, -0.15], gravity: 1.1, drag: 0.5,
              size: [0.006, 0.013], life: [0.6, 1] });
  } else if (b.y < hit.center) {
    add(10, { shape: 'leaf', color: '#5d9e45', vx: [-0.15, 0.1], vy: [-0.1, 0.1], gravity: 0.12, drag: 1.5,
              size: [0.01, 0.016], life: [1.2, 1.8] });
  } else {
    add(8, { shape: 'drop', color: '#9a8c7a', vx: [-0.15, 0.1], vy: [-0.3, -0.1], gravity: 0.9, drag: 0.5,
             size: [0.005, 0.009], life: [0.6, 0.9] });
  }
  add(8, { shape: 'feather', color: '#ffd23f', vx: [-0.18, 0.08], vy: [-0.2, 0.05], gravity: 0.1, drag: 1.8,
           size: [0.012, 0.018], life: [1.2, 1.8] });
}

function endRun() {
  game.state = 'over';
  const key = bestKey();
  const best = Math.max(game.score, store.get(key, 0));
  store.set(key, best);
  $('overTitle').textContent = game.mode === 'timed' ? "Time's up!" : 'Splash!';
  $('finalScore').textContent = game.score;
  $('bestOver').textContent = best;
  const avg = game.strokes ? Math.round(game.wattsTotal / game.strokes) : 0;
  const crashes = game.crashes === 1 ? '1 crash' : `${game.crashes} crashes`;
  $('overStats').textContent = `${game.strokes} strokes · avg ${avg} W · ${crashes}`;
  setHud(false);
  showOnly('overMenu');
}

function pause(message = '') {
  if (game.state !== 'playing' && game.state !== 'countdown') return;
  game.state = 'paused';
  $('countdown').classList.add('hidden');
  $('pauseMsg').textContent = message;
  refreshPauseMenu();
  showOnly('pauseMenu');
}

// Resume needs a data source; Reconnect shows when the PM5 dropped and isn't being retried.
function refreshPauseMenu() {
  $('resumeBtn').disabled = !rower.source;
  $('reconnectBtn').classList.toggle('hidden', !!rower.source || !pm5Device);
  $('reconnectBtn').disabled = reconnecting;
  $('reconnectBtn').textContent = reconnecting ? 'Reconnecting…' : 'Reconnect PM5';
}

/* --- Sound: soft synthesized notes and noise, no audio files ------- */
let audio = null, noiseBuf = null;
function audioCtx() {
  if (!settings.sound) return null;
  audio ??= new AudioContext();
  if (audio.state === 'suspended') audio.resume();
  return audio;
}

// One note with a quick attack and a smooth fade. `slide` bends the pitch by that factor.
function tone(freq, dur, { type = 'triangle', vol = 0.12, delay = 0, slide = 1 } = {}) {
  const a = audioCtx();
  if (!a) return;
  const t = a.currentTime + delay;
  const osc = a.createOscillator(), gain = a.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slide !== 1) osc.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain).connect(a.destination);
  osc.start(t);
  osc.stop(t + dur + 0.05);
}

// Filtered white noise for whooshes and splashes. `sweep` moves the filter by that factor.
function noise(dur, { freq = 800, q = 1, vol = 0.1, delay = 0, sweep = 1 } = {}) {
  const a = audioCtx();
  if (!a) return;
  if (!noiseBuf) {
    noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = a.currentTime + delay;
  const src = a.createBufferSource(), filter = a.createBiquadFilter(), gain = a.createGain();
  src.buffer = noiseBuf;
  filter.type = 'bandpass';
  filter.Q.value = q;
  filter.frequency.setValueAtTime(freq, t);
  if (sweep !== 1) filter.frequency.exponentialRampToValueAtTime(freq * sweep, t + dur);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(vol, t + dur * 0.25);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(filter).connect(gain).connect(a.destination);
  src.start(t);
  src.stop(t + dur + 0.05);
}

const SOUNDS = {
  count: () => tone(523, 0.2),
  go: () => [523, 659, 784].forEach((f, i) => tone(f, i === 2 ? 0.5 : 0.15, { delay: i * 0.08 })),
  finish: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i === 3 ? 0.8 : 0.2, { delay: i * 0.12 })),
  // A whoosh of air under the wings; louder for harder strokes.
  stroke: ratio => noise(0.4, { freq: 350, sweep: 3, q: 0.7, vol: 0.04 + 0.04 * clamp(ratio, 0, 2) }),
  gate: () => { tone(988, 0.3, { type: 'sine', vol: 0.07 }); tone(1319, 0.4, { type: 'sine', vol: 0.05, delay: 0.07 }); },
  close: () => [1175, 1480, 1760].forEach((f, i) => tone(f, 0.3, { type: 'sine', vol: 0.07, delay: i * 0.06 })),
  good: () => [659, 784, 988, 1319].forEach((f, i) => tone(f, 0.25, { delay: i * 0.07 })),
  bad: () => { tone(392, 0.6, { slide: 0.6, vol: 0.13 }); tone(370, 0.6, { slide: 0.6, vol: 0.08, delay: 0.05 }); },
  shield: () => { tone(660, 0.4, { type: 'sine', slide: 1.6 }); noise(0.3, { freq: 2500, vol: 0.05 }); },
  crash: water => {
    noise(water ? 0.7 : 0.4, { freq: water ? 1400 : 500, sweep: 0.3, q: 0.6, vol: 0.3 });
    tone(130, 0.35, { type: 'sine', slide: 0.5, vol: 0.25 });
  },
};
function sound(name, arg) {
  try { SOUNDS[name](arg); } catch {}
}

/* ------------------------------------------------------------------
 * Drawing (canvas is scaled so 1 unit = screen height)
 * ------------------------------------------------------------------ */
const canvas = $('game');
const ctx = canvas.getContext('2d');
let worldW = 1;
let viewH = 1;    // screen height in CSS pixels
let birdX = 0.3;  // further left on narrow screens so you see gates coming

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr * h, 0, 0, dpr * h, 0, 0);
  worldW = w / h;
  viewH = h;
  birdX = clamp(worldW * 0.15, 0.08, 0.3);
  $('rotateHint').classList.toggle('hidden', worldW >= 1);
}

// Text is drawn in pixel space; tiny fractional font sizes render unreliably.
function drawText(text, x, y, size, fill, { bold = true, outline = true } = {}) {
  ctx.save();
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const px = Math.round(size * viewH);
  ctx.font = `${bold ? 'bold ' : ''}${px}px system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (outline) {
    ctx.lineWidth = px * 0.28;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(29,43,54,.85)';
    ctx.strokeText(text, x * viewH, y * viewH);
  }
  ctx.fillStyle = fill;
  ctx.fillText(text, x * viewH, y * viewH);
  ctx.restore();
}

/* --- Time of day --------------------------------------------------
 * Phase 0 → 1 is one day: morning, midday, afternoon, sunset, dusk,
 * night, dawn. Background colors blend between these stops; gates,
 * items and the bird keep their colors so they stay easy to see.
 * ---------------------------------------------------------------- */
const DAY = [
  // phase, sky top, sky bottom, hills, water top, water bottom, darkness
  [0.00, '#8bbbe0', '#ffe3c2', '#a3d6a0', '#4b9cc9', '#22648f', 0],
  [0.22, '#5fb4dc', '#c9ecf5', '#8fd19e', '#2f8fc4', '#1d5f8a', 0],
  [0.48, '#58a2d6', '#eef0cf', '#88c98c', '#2d88bb', '#1c5a84', 0],
  [0.64, '#6a7dc4', '#ffb877', '#86ac70', '#3f7fb0', '#22507a', 0.15],
  [0.75, '#3d4384', '#ec8a70', '#607f5f', '#335f8f', '#1b3a5e', 0.45],
  [0.86, '#1c2550', '#34467c', '#3a5650', '#244470', '#11284a', 0.85],
  [0.94, '#3c4c8e', '#e9a48e', '#6b9175', '#38709e', '#1b4870', 0.4],
  [1.00, '#8bbbe0', '#ffe3c2', '#a3d6a0', '#4b9cc9', '#22648f', 0],
].map(([t, ...c]) => ({ t, colors: c.slice(0, 5).map(hexRgb), dark: c[5] }));
const NIGHT_RGB = [22, 28, 62];

function hexRgb(hex) { return [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)); }
const mixRgb = (a, b, f) => a.map((v, i) => Math.round(v + (b[i] - v) * f));
const rgb = c => `rgb(${c.join()})`;

// Timed runs go from morning to dusk; Endless loops a full day every DAY_MINUTES.
function dayPhase() {
  if (game.state === 'menu') return 0.22;
  if (game.mode === 'timed') return 0.02 + 0.73 * clamp(game.runTime / game.duration, 0, 1);
  return (0.02 + game.runTime / (DAY_MINUTES * 60)) % 1;
}

let scene = null;  // this frame's colors
function sceneAt(phase) {
  let i = 0;
  while (phase > DAY[i + 1].t) i++;
  const a = DAY[i], b = DAY[i + 1], f = (phase - a.t) / (b.t - a.t);
  const [skyTop, skyBottom, hills, waterTop, waterBottom] = a.colors.map((c, k) => rgb(mixRgb(c, b.colors[k], f)));
  const dark = a.dark + (b.dark - a.dark) * f;
  // Landmark colors fade toward night blue as it gets dark.
  return { phase, skyTop, skyBottom, hills, waterTop, waterBottom, dark,
           tint: hex => rgb(mixRgb(hexRgb(hex), NIGHT_RGB, dark * 0.7)) };
}

function draw() {
  scene = sceneAt(dayPhase());
  ctx.save();
  if (game.shake > 0) {
    const amp = 0.012 * game.shake / 0.4;
    ctx.translate((Math.random() - 0.5) * amp, (Math.random() - 0.5) * amp);
  }
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0, scene.skyTop);
  sky.addColorStop(1, scene.skyBottom);
  ctx.fillStyle = sky;
  ctx.fillRect(-0.05, -0.05, worldW + 0.1, 1.1);

  drawSkyLights();
  drawClouds();
  drawHills();
  for (const p of game.gates) drawGate(p);
  for (const it of game.items) drawItem(it);
  drawReeds();
  drawWater();
  drawBird();
  drawParticles();
  drawPopups();
  ctx.restore();

  if (game.flash > 0) {
    ctx.fillStyle = `rgba(255,70,50,${0.3 * game.flash})`;
    ctx.fillRect(0, 0, worldW, 1);
  }
  if (game.state !== 'menu' && game.state !== 'over') { drawPowerBar(); drawRhythm(); }
}

// Fixed star positions, spread over the upper sky.
const STARS = Array.from({ length: 50 }, () => [Math.random(), Math.random() * 0.55, Math.random()]);

// The sun crosses the sky during the day; the moon and stars come out at night.
function drawSkyLights() {
  const { phase, dark } = scene;
  if (dark > 0.05) {
    for (const [sx, sy, tw] of STARS) {
      ctx.fillStyle = `rgba(255,255,240,${dark * (0.5 + 0.5 * Math.sin(game.time * 2 + tw * 20))})`;
      ctx.fillRect(sx * worldW, sy, 0.004, 0.004);
    }
  }
  const arc = (u, r, color, glow) => {
    const x = worldW * (0.08 + 0.84 * u), y = 0.78 - 0.62 * Math.sin(Math.PI * u);
    const g = ctx.createRadialGradient(x, y, r * 0.8, x, y, r * 3);
    g.addColorStop(0, glow); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r * 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  };
  if (phase < 0.78) {
    const u = phase / 0.78, low = 1 - Math.sin(Math.PI * u);  // 1 near the horizon
    arc(u, 0.05 + 0.015 * low, rgb(mixRgb([255, 246, 196], [255, 150, 80], low)), `rgba(255,220,150,${0.35 + 0.25 * low})`);
  } else {
    arc((phase - 0.78) / 0.22, 0.04, '#f2f0e0', 'rgba(220,230,255,.25)');
  }
}

function drawClouds() {
  ctx.fillStyle = `rgba(255,255,255,${0.85 - 0.55 * scene.dark})`;
  const span = worldW + 0.6;
  for (let i = 0; i < 4; i++) {
    const x = ((i * 0.53 - game.scrollX * 0.15) % span + span) % span - 0.3;
    const y = 0.1 + (i % 3) * 0.09;
    for (const [dx, dy, r] of [[0, 0, 0.05], [0.05, -0.02, 0.06], [0.11, 0, 0.045]]) {
      ctx.beginPath(); ctx.arc(x + dx, y + dy, r, 0, Math.PI * 2); ctx.fill();
    }
  }
}

const HILL_PARALLAX = 0.3;
const hillY = x => {
  const wx = x + game.scrollX * HILL_PARALLAX;
  return 0.74 + Math.sin(wx * 3.1) * 0.035 + Math.sin(wx * 7.3) * 0.015;
};

function drawHills() {
  drawLandmarks();
  ctx.fillStyle = scene.hills;
  ctx.beginPath();
  ctx.moveTo(-0.05, GROUND);
  for (let x = -0.05; x <= worldW + 0.07; x += 0.02) ctx.lineTo(x, hillY(x));
  ctx.lineTo(worldW + 0.07, GROUND);
  ctx.fill();
}

/* --- Landmarks on the far bank, so a long run feels like a journey ---
 * One slot every LANDMARK_GAP along the hills; a hash of the slot
 * number picks what stands there, so it's the same every time you pass. */
const LANDMARK_GAP = 0.9;
const LANDMARKS = ['trees', 'windmill', 'trees', 'cottage', 'church', null, 'trees', 'cottage', 'tower', null];

function drawLandmarks() {
  const shift = game.scrollX * HILL_PARALLAX;
  const first = Math.floor(shift / LANDMARK_GAP) - 1;
  for (let n = first; n < first + worldW / LANDMARK_GAP + 3; n++) {
    const h = (Math.imul(n, 2654435761) >>> 0) / 2 ** 32;
    const kind = LANDMARKS[Math.floor(h * LANDMARKS.length)];
    if (!kind) continue;
    const x = n * LANDMARK_GAP + h * 0.3 - shift;
    if (x < -0.2 || x > worldW + 0.2) continue;
    // Planted a little into the hill so the base is hidden
    LANDMARK_DRAW[kind](x, hillY(x) + 0.02, scene.tint, h);
  }
}

const LANDMARK_DRAW = {
  trees(x, y, tint, h) {
    for (const [dx, s] of [[-0.03, 0.8], [0, 1.1], [0.035, 0.9]]) {
      ctx.fillStyle = tint('#7a5a3a');
      ctx.fillRect(x + dx - 0.003, y - 0.05 * s, 0.006, 0.05 * s);
      ctx.fillStyle = tint(h > 0.5 ? '#4f8f4a' : '#5f9b4c');
      ctx.beginPath(); ctx.arc(x + dx, y - 0.06 * s, 0.026 * s, 0, Math.PI * 2); ctx.fill();
    }
  },
  windmill(x, y, tint) {
    ctx.fillStyle = tint('#e8dcc0');
    ctx.beginPath();
    ctx.moveTo(x - 0.025, y); ctx.lineTo(x - 0.014, y - 0.12); ctx.lineTo(x + 0.014, y - 0.12); ctx.lineTo(x + 0.025, y);
    ctx.fill();
    ctx.fillStyle = tint('#9a5b3f');
    ctx.beginPath(); ctx.moveTo(x - 0.018, y - 0.12); ctx.lineTo(x, y - 0.145); ctx.lineTo(x + 0.018, y - 0.12); ctx.fill();
    ctx.fillStyle = tint('#6b5a48');
    ctx.fillRect(x - 0.006, y - 0.03, 0.012, 0.03);
    ctx.save();
    ctx.translate(x, y - 0.115);
    ctx.rotate(game.time * 0.6);
    ctx.strokeStyle = tint('#6b5a48');
    ctx.lineWidth = 0.004;
    for (let i = 0; i < 4; i++) {
      ctx.rotate(Math.PI / 2);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -0.065); ctx.stroke();
      ctx.fillStyle = tint('#f3ead6');
      ctx.fillRect(0.002, -0.065, 0.012, 0.045);
    }
    ctx.restore();
  },
  cottage(x, y, tint) {
    ctx.fillStyle = tint('#f3e6c8');
    ctx.fillRect(x - 0.035, y - 0.045, 0.07, 0.045);
    ctx.fillStyle = tint('#b5523b');
    ctx.beginPath(); ctx.moveTo(x - 0.044, y - 0.045); ctx.lineTo(x, y - 0.08); ctx.lineTo(x + 0.044, y - 0.045); ctx.fill();
    ctx.fillRect(x + 0.015, y - 0.085, 0.01, 0.025);  // chimney
    // Windows light up after dark
    ctx.fillStyle = scene.dark > 0.3 ? '#ffd877' : tint('#6d8fa8');
    ctx.fillRect(x - 0.025, y - 0.033, 0.013, 0.013);
    ctx.fillRect(x + 0.012, y - 0.033, 0.013, 0.013);
    ctx.fillStyle = tint('#7a5a3a');
    ctx.fillRect(x - 0.006, y - 0.025, 0.012, 0.025);
  },
  church(x, y, tint) {
    ctx.fillStyle = tint('#d8d0c0');
    ctx.fillRect(x - 0.04, y - 0.05, 0.055, 0.05);
    ctx.fillRect(x + 0.015, y - 0.1, 0.025, 0.1);
    ctx.fillStyle = tint('#7b8a9a');
    ctx.beginPath(); ctx.moveTo(x + 0.012, y - 0.1); ctx.lineTo(x + 0.0275, y - 0.16); ctx.lineTo(x + 0.043, y - 0.1); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 0.045, y - 0.05); ctx.lineTo(x - 0.0125, y - 0.075); ctx.lineTo(x + 0.02, y - 0.05); ctx.fill();
    ctx.fillStyle = scene.dark > 0.3 ? '#ffd877' : tint('#6d8fa8');
    ctx.beginPath(); ctx.arc(x + 0.0275, y - 0.075, 0.006, 0, Math.PI * 2); ctx.fill();
  },
  tower(x, y, tint) {
    ctx.fillStyle = tint('#b9ad9b');
    ctx.fillRect(x - 0.022, y - 0.11, 0.044, 0.11);
    for (let i = 0; i < 3; i++) ctx.fillRect(x - 0.026 + i * 0.019, y - 0.125, 0.014, 0.016);  // battlements
    ctx.fillStyle = tint('#5b4e40');
    ctx.fillRect(x - 0.005, y - 0.08, 0.01, 0.02);
  },
};

// Each gate: willow branches hanging from above, a stone bridge pillar rising from the river.
function drawGate(p) {
  drawWillow(p.x, p.center - p.gapSize / 2, p.seed);
  drawPillar(p.x, p.center + p.gapSize / 2);
}

function drawPillar(x, top) {
  const left = x - GATE_W / 2;
  const h = GROUND - top + 0.03;  // runs under the water surface, which is drawn on top
  ctx.save();
  ctx.fillStyle = '#b3a593';
  ctx.fillRect(left, top, GATE_W, h);
  ctx.beginPath(); ctx.rect(left, top, GATE_W, h); ctx.clip();
  // Brick courses, every other row offset by half a brick
  ctx.strokeStyle = 'rgba(80,66,52,.45)';
  ctx.lineWidth = 0.003;
  const row = 0.035, brick = GATE_W / 2;
  for (let y = top + 0.03, i = 0; y < top + h; y += row, i++) {
    ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(left + GATE_W, y); ctx.stroke();
    for (let bx = left + (i % 2 ? brick / 2 : brick); bx < left + GATE_W; bx += brick) {
      ctx.beginPath(); ctx.moveTo(bx, y); ctx.lineTo(bx, y + row); ctx.stroke();
    }
  }
  // Shade the right side, moss at the waterline
  ctx.fillStyle = 'rgba(0,0,0,.13)';
  ctx.fillRect(left + GATE_W * 0.72, top, GATE_W * 0.28, h);
  ctx.fillStyle = 'rgba(70,120,50,.6)';
  ctx.fillRect(left, GROUND - 0.04, GATE_W, 0.06);
  ctx.restore();
  ctx.strokeStyle = '#5b4e40';
  ctx.lineWidth = 0.004;
  ctx.strokeRect(left, top, GATE_W, h);
  // Capstone
  const over = 0.012;
  ctx.fillStyle = '#9a8c7a';
  ctx.fillRect(left - over, top, GATE_W + over * 2, 0.03);
  ctx.strokeRect(left - over, top, GATE_W + over * 2, 0.03);
}

// A curtain of willow leaves; the longest strands end exactly at the gap edge (the hitbox).
function drawWillow(x, bottom, seed) {
  const left = x - GATE_W / 2;
  const body = bottom - 0.05;
  ctx.fillStyle = '#3f7a35';
  ctx.fillRect(left, 0, GATE_W, Math.max(0, body));
  ctx.beginPath();  // lumpy lower edge of the canopy
  for (let i = 0; i < 4; i++) {
    const cx = left + GATE_W * (i + 0.5) / 4;
    ctx.moveTo(cx + 0.028, body);
    ctx.arc(cx, body, 0.028, 0, Math.PI * 2);
  }
  ctx.fill();
  // Lighter leaf texture on the canopy
  ctx.strokeStyle = 'rgba(140,200,100,.35)';
  ctx.lineWidth = 0.006;
  ctx.lineCap = 'round';
  for (let i = 0; i < 5; i++) {
    const sx = left + 0.015 + (GATE_W - 0.03) * i / 4;
    ctx.beginPath(); ctx.moveTo(sx, Math.max(0, body - 0.25)); ctx.lineTo(sx, body); ctx.stroke();
  }
  // Drooping strands, gently swaying
  for (let i = 0; i < 7; i++) {
    const sx = left + 0.008 + (GATE_W - 0.016) * i / 6;
    const len = i % 3 === 1 ? 0.05 : 0.04 + 0.01 * ((seed * (i + 3) * 7.13) % 1);
    const sway = Math.sin(game.time * 1.5 + seed * 10 + i) * 0.004;
    ctx.strokeStyle = i % 2 ? '#5d9e45' : '#78b856';
    ctx.lineWidth = 0.011;
    ctx.beginPath();
    ctx.moveTo(sx, body - 0.01);
    ctx.quadraticCurveTo(sx + sway, body + len / 2, sx + sway * 2, body + len - 0.0055);
    ctx.stroke();
  }
}

// Reeds and cattails along the near bank.
function drawReeds() {
  const spacing = 0.37;
  const offset = game.scrollX % spacing;
  ctx.lineCap = 'round';
  for (let x0 = -offset; x0 < worldW + spacing; x0 += spacing) {
    const n = Math.floor((x0 + game.scrollX) / spacing + 0.5);  // stable per clump
    for (let j = 0; j < 3; j++) {
      const x = x0 + j * 0.018 + (n % 3) * 0.05;
      const tall = 0.045 + ((n * 7 + j * 3) % 5) * 0.008;
      ctx.strokeStyle = '#4f7d33';
      ctx.lineWidth = 0.005;
      ctx.beginPath(); ctx.moveTo(x, GROUND + 0.01); ctx.lineTo(x + 0.004 * (j - 1), GROUND - tall); ctx.stroke();
      if (j === 1) {
        ctx.strokeStyle = '#7a4f2a';
        ctx.lineWidth = 0.011;
        ctx.beginPath(); ctx.moveTo(x, GROUND - tall + 0.01); ctx.lineTo(x, GROUND - tall + 0.03); ctx.stroke();
      }
    }
  }
}

// A bubble with an icon: green ring for good, red ring for bad.
function drawItem(it) {
  const kind = ITEMS[it.type];
  const y = it.y + Math.sin(game.time * 3 + it.x * 10) * 0.008;
  ctx.fillStyle = kind.good ? 'rgba(220,255,225,.85)' : 'rgba(255,225,220,.85)';
  ctx.strokeStyle = kind.good ? '#3fa34d' : '#d9483b';
  ctx.lineWidth = 0.007;
  ctx.beginPath(); ctx.arc(it.x, y, ITEM_R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  drawText(kind.icon, it.x, y + 0.003, ITEM_R * 1.15, '#000', { bold: false, outline: false });
}

function drawWater() {
  const water = ctx.createLinearGradient(0, GROUND, 0, 1);
  water.addColorStop(0, scene.waterTop);
  water.addColorStop(1, scene.waterBottom);
  ctx.fillStyle = water;
  ctx.beginPath();
  ctx.moveTo(-0.05, 1.05);
  for (let x = -0.05; x <= worldW + 0.07; x += 0.02) {
    ctx.lineTo(x, GROUND + Math.sin((x + game.scrollX) * 25 + game.time * 2) * 0.005);
  }
  ctx.lineTo(worldW + 0.07, 1.05);
  ctx.fill();
}

function drawParticles() {
  for (const q of game.particles) {
    ctx.save();
    ctx.globalAlpha = clamp((q.life - q.age) / 0.4, 0, 1);
    ctx.translate(q.x, q.y);
    ctx.rotate(q.angle);
    ctx.fillStyle = q.color;
    ctx.beginPath();
    if (q.shape === 'drop') ctx.arc(0, 0, q.size, 0, Math.PI * 2);
    else ctx.ellipse(0, 0, q.size, q.size * (q.shape === 'leaf' ? 0.45 : 0.3), 0, 0, Math.PI * 2);
    ctx.fill();
    if (q.shape === 'feather') {
      ctx.strokeStyle = '#c98a00';
      ctx.lineWidth = 0.0015;
      ctx.beginPath(); ctx.moveTo(-q.size, 0); ctx.lineTo(q.size, 0); ctx.stroke();
    }
    ctx.restore();
  }
}

// Ring under the power bar: fills over one stroke at RHYTHM_SPM, then pulses
// green when your next stroke is due. Rowing to it holds level flight at target power.
function drawRhythm() {
  const x = worldW - 0.039, y = 0.75, r = 0.03;
  const frac = game.state === 'playing' ? (game.time - game.lastDriveAt) / (60 / RHYTHM_SPM) : 0;
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.lineCap = 'round';
  if (frac >= 1) {
    const pulse = 0.5 + 0.5 * Math.sin(game.time * 10);
    ctx.fillStyle = `rgba(125,255,160,${0.55 + 0.45 * pulse})`;
    ctx.beginPath(); ctx.arc(x, y, r * (0.85 + 0.15 * pulse), 0, Math.PI * 2); ctx.fill();
  } else if (frac > 0) {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 0.007;
    ctx.beginPath(); ctx.arc(x, y, r - 0.006, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac); ctx.stroke();
  }
}

function drawBird() {
  const b = game.bird, r = BIRD_R;
  if (game.invuln > 0 && Math.floor(game.invuln * 8) % 2) return;  // blink after a hit
  const bob = game.state === 'countdown' ? Math.sin(game.time * 4) * 0.01 : 0;
  ctx.save();
  ctx.translate(birdX, b.y + bob);

  if (game.shield) {
    ctx.fillStyle = 'rgba(120,200,255,.25)';
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.lineWidth = 0.005;
    ctx.beginPath(); ctx.arc(0, 0, r * 1.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }

  ctx.rotate(clamp(b.vy * 3, -0.5, 0.7));
  ctx.lineWidth = r * 0.12;
  ctx.strokeStyle = '#4a3b00';

  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  ctx.fillStyle = '#fff1b8';
  ctx.beginPath(); ctx.ellipse(r * 0.1, r * 0.45, r * 0.55, r * 0.35, 0, 0, Math.PI * 2); ctx.fill();

  ctx.save();
  ctx.translate(-r * 0.25, r * 0.05);
  ctx.rotate(0.3 - b.flap * 1.1);
  ctx.fillStyle = '#f4a300';
  ctx.beginPath(); ctx.ellipse(-r * 0.2, 0, r * 0.55, r * 0.3, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.restore();

  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(r * 0.4, -r * 0.35, r * 0.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(r * 0.5, -r * 0.35, r * 0.13, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#ff7b29';
  ctx.beginPath();
  ctx.moveTo(r * 0.8, -r * 0.05); ctx.lineTo(r * 1.4, r * 0.12); ctx.lineTo(r * 0.8, r * 0.32);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}

// Stroke watts and item names float up and fade out.
function drawPopups() {
  for (const p of game.popups) {
    ctx.save();
    ctx.globalAlpha = clamp(1.8 - p.age * 1.4, 0, 1);
    drawText(p.text, p.x, p.y, p.size, p.color);
    ctx.restore();
  }
}

// Vertical bar on the right: last stroke's power; the white line is your target.
function drawPowerBar() {
  const x = worldW - 0.05, top = 0.18, h = 0.5, w = 0.022;
  const ratio = rower.watts / targetWatts;
  const level = clamp(ratio / 2, 0, 1);  // bar tops out at double the target
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  ctx.fillRect(x, top, w, h);
  ctx.fillStyle = ratio < 0.8 ? '#ff8c42' : '#3fa34d';
  ctx.fillRect(x, top + h * (1 - level), w, h * level);
  ctx.fillStyle = '#fff';
  ctx.fillRect(x - 0.012, top + h / 2 - 0.002, w + 0.024, 0.004);
}

/* ------------------------------------------------------------------
 * UI wiring
 * ------------------------------------------------------------------ */
function setStatus(text) { $('status').textContent = text; }
function setConnectButton(state, deviceName = '') {
  const btn = $('connectBtn');
  btn.classList.toggle('connected', state === 'connected');
  btn.disabled = state !== 'idle';
  $('simBtn').disabled = state === 'connected';  // one data source at a time
  if (state === 'connected') {
    $('simBtn').textContent = 'Try without rower';
    $('simBtn').classList.remove('connected');
    btn.textContent = '✓ Connected';
    btn.insertAdjacentHTML('beforeend', '<small></small>');
    btn.querySelector('small').textContent = deviceName;
  } else {
    btn.textContent = state === 'connecting' ? 'Connecting…' : pm5Device && !chooserNext ? 'Reconnect PM5' : 'Connect PM5';
  }
}
function showStart() { $('startBtn').classList.remove('hidden'); }
function hideStart() { $('startBtn').classList.add('hidden'); }
function showOnly(id) {
  for (const o of ['menu', 'pauseMenu', 'overMenu']) $(o).classList.toggle('hidden', o !== id);
  if (id) { $('countdown').classList.add('hidden'); $('banner').classList.add('hidden'); }
  if (id === 'menu') refreshMenu();
}
function setHud(visible) {
  $('hudTop').classList.toggle('hidden', !visible);
  $('hudBottom').classList.toggle('hidden', !visible);
}

function refreshMenu() {
  document.querySelectorAll('.seg[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === settings.mode));
  document.querySelectorAll('.seg[data-diff]').forEach(b => b.classList.toggle('on', b.dataset.diff === settings.difficulty));
  $('soundBtn').textContent = settings.sound ? '🔊 Sound' : '🔇 Sound off';
  $('durationBox').classList.toggle('hidden', settings.mode !== 'timed');
  $('durationInput').value = settings.durationIdx;
  $('durationLabel').textContent = `${runMinutes()} min`;
  $('powerupsInput').checked = settings.powerups;
  $('bestLabel').textContent = bestLabel();
  $('bestMenu').textContent = store.get(bestKey(), 0);
}

let hudTimer = 0;
function updateHud(dt) {
  hudTimer -= dt;
  if (hudTimer > 0) return;
  hudTimer = 0.2;
  $('score').textContent = game.score;
  $('lives').textContent = '❤️'.repeat(Math.max(0, game.lives));
  $('timer').textContent = formatClock(game.timeLeft);
  $('timer').classList.toggle('ending', game.timeLeft <= 30);
  $('spm').textContent = rower.spm || '–';
  $('spm').classList.toggle('onbeat', Math.abs(rower.spm - RHYTHM_SPM) <= 2);
  $('pace').textContent = formatPace(rower.pace);
  $('watts').textContent = rower.watts || '–';

  const chips = [];
  if (game.shield) chips.push(['🛡️', '']);
  if (game.light > 0) chips.push([`🪶 ${Math.ceil(game.light)}s`, '']);
  if (game.heavy > 0) chips.push([`⚓ ${Math.ceil(game.heavy)}s`, 'bad']);
  $('effects').replaceChildren(...chips.map(([text, cls]) => {
    const el = document.createElement('span');
    el.className = 'chip ' + cls;
    el.textContent = text;
    return el;
  }));
}

// Stop the phone from going to sleep mid-workout.
let wakeLock = null;
async function keepScreenOn() {
  try { if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); }
  catch {}
  if (wakeLock) wakeLock.addEventListener('release', () => { wakeLock = null; }, { once: true });
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && game.state !== 'menu') keepScreenOn();
  if (document.visibilityState === 'hidden') pause('Paused while the app was in the background.');
});

$('connectBtn').addEventListener('click', connectPM5);
$('simBtn').addEventListener('click', () => {
  const on = rower.source !== 'sim';
  rower.source = on ? 'sim' : null;
  $('simBtn').textContent = on ? '✓ Simulator on' : 'Try without rower';
  $('simBtn').classList.toggle('connected', on);
  setStatus(on ? 'Simulator: press and hold the screen for each stroke. Hold ~½ second for target power, longer for more.' : '');
  if (on) showStart(); else hideStart();
});
// Full screen: the installed app opens full screen from the manifest; in a browser tab the
// button (or tapping Start) asks for it. Needs a tap, so it can't happen on page load.
const canFullscreen = () => document.fullscreenEnabled && !document.fullscreenElement &&
  !matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
function enterFullscreen() { if (canFullscreen()) document.documentElement.requestFullscreen().catch(() => {}); }
function refreshFsBtn() { $('fsBtn').classList.toggle('hidden', !canFullscreen()); }
document.addEventListener('fullscreenchange', refreshFsBtn);
$('fsBtn').addEventListener('click', enterFullscreen);
refreshFsBtn();

$('startBtn').addEventListener('click', () => { enterFullscreen(); startGame(); });
$('againBtn').addEventListener('click', startGame);
$('menuBtn').addEventListener('click', () => { game.state = 'menu'; showOnly('menu'); });
$('pauseBtn').addEventListener('click', ev => { ev.stopPropagation(); pause(); });
$('reconnectBtn').addEventListener('click', async () => {
  $('pauseMsg').textContent = 'Reconnecting…';
  if (!await reconnectPM5()) {
    $('pauseMsg').textContent = "Still can't reach it. Press a button on the PM5 to wake it, then try again.";
  }
});
$('resumeBtn').addEventListener('click', () => { showOnly(null); keepScreenOn(); startCountdown(); });
$('quitBtn').addEventListener('click', () => { game.state = 'menu'; setHud(false); showOnly('menu'); });

document.querySelectorAll('.seg[data-mode]').forEach(b => b.addEventListener('click', () => {
  settings.mode = b.dataset.mode;
  store.set('runMode', settings.mode);
  refreshMenu();
}));
document.querySelectorAll('.seg[data-diff]').forEach(b => b.addEventListener('click', () => {
  settings.difficulty = b.dataset.diff;
  store.set('difficulty', settings.difficulty);
  refreshMenu();
}));
$('soundBtn').addEventListener('click', () => {
  settings.sound = !settings.sound;
  store.set('sound', settings.sound);
  refreshMenu();
  sound('count');
});
$('durationInput').addEventListener('input', () => {
  settings.durationIdx = +$('durationInput').value;
  store.set('durationIdx', settings.durationIdx);
  refreshMenu();
});
$('powerupsInput').addEventListener('change', () => {
  settings.powerups = $('powerupsInput').checked;
  store.set('powerups', settings.powerups);
});

$('targetInput').value = targetWatts;
$('targetInput').addEventListener('change', () => {
  const w = Math.round(+$('targetInput').value);
  if (w >= 30 && w <= 600) { targetWatts = w; store.set('target', w); }
  $('targetInput').value = targetWatts;
});

// Simulator input: hold the playfield or the space bar as the drive.
const simActive = () => rower.source === 'sim' && (game.state === 'playing' || game.state === 'countdown');
canvas.addEventListener('pointerdown', () => { if (simActive()) simPress(); });
addEventListener('pointerup', simRelease);
addEventListener('pointercancel', simRelease);
addEventListener('keydown', ev => {
  if (ev.code === 'Space' && simActive()) { ev.preventDefault(); if (!ev.repeat) simPress(); }
});
addEventListener('keyup', ev => { if (ev.code === 'Space') simRelease(); });

if (!navigator.bluetooth) {
  $('connectBtn').disabled = true;
  setStatus('Bluetooth needs Chrome on Android, opened from an https:// address.');
}
addEventListener('resize', resize);
resize();
refreshMenu();

let lastFrame = performance.now();
function frame(now) {
  const dt = clamp((now - lastFrame) / 1000, 0, 0.05);  // cap so a stall doesn't teleport the bird
  lastFrame = now;
  update(dt);
  draw();
  if (game.state === 'playing' || game.state === 'countdown') updateHud(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
