<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed so Android can crop it to any mask shape; the bird stays inside the central safe zone. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb8de"/><stop offset="1" stop-color="#a9def0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- willow strands from the top -->
  <g stroke="#3f8f3a" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M40 0 C44 50 36 90 42 130"/><path d="M78 0 C82 40 74 70 80 100"/>
    <path d="M440 0 C436 50 444 80 438 115"/><path d="M476 0 C472 40 480 80 474 140"/>
  </g>
  <!-- river -->
  <rect y="404" width="512" height="108" fill="#2f86b5"/>
  <path d="M0 404 H512" stroke="#bfe6f5" stroke-width="8"/>
  <path d="M70 450 h70 M300 470 h90 M180 488 h50" stroke="#7cc3e3" stroke-width="7" stroke-linecap="round"/>
  <!-- bird, same shapes as drawBird() -->
  <g transform="translate(240 250) rotate(-12) scale(118)" stroke="#4a3b00" stroke-width="0.12" stroke-linejoin="round">
    <circle r="1" fill="#ffd23f"/>
    <ellipse cx="0.1" cy="0.45" rx="0.55" ry="0.35" fill="#fff1b8" stroke="none"/>
    <g transform="translate(-0.25 0.05) rotate(-25)">
      <ellipse cx="-0.2" rx="0.55" ry="0.3" fill="#f4a300"/>
    </g>
    <circle cx="0.4" cy="-0.35" r="0.3" fill="#fff"/>
    <circle cx="0.5" cy="-0.35" r="0.13" fill="#000" stroke="none"/>
    <path d="M0.8 -0.05 L1.4 0.12 L0.8 0.32 Z" fill="#ff7b29"/>
  </g>
</svg>
